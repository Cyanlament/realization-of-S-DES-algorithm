name: S-DES verification
on: [push, pull_request, workflow_dispatch]

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core, exhaustive and independent C++ checks
        run: python tools/run_experiments.py
      - name: Verify portable exchange vectors
        run: python tools/verify_vectors.py evidence/cross_vectors.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: evidence/
